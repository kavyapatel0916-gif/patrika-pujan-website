<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Patrika Pujan Invitation</title>
  <style>
    @font-face {
      font-family: 'NotoSerifGujarati';
      src: url('./assets/NotoSerifGujarati-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    :root{--maroon:#65132b;--gold:#b08a45;--cream:#fbf7f0;--ink:#291a20}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#f7efe5,#fffaf5);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 18px 42px}
    header{text-align:center;margin-bottom:20px}
    .orn{color:var(--maroon);letter-spacing:7px;font-size:20px}
    h1{font-family:Georgia,serif;color:var(--maroon);margin:8px 0 4px;font-size:30px}
    .sub{margin:0;color:#705d62}
    .card{background:rgba(255,255,255,.9);border:1px solid #dbc9b1;border-radius:18px;box-shadow:0 14px 40px rgba(80,35,45,.12);overflow:hidden}
    .controls{padding:18px;display:flex;gap:12px;align-items:end;flex-wrap:wrap;border-bottom:1px solid #eadfd2;background:var(--cream)}
    .field{flex:1;min-width:220px}
    .field label{display:block;font-weight:700;color:var(--maroon);margin-bottom:7px}
    input{width:100%;height:48px;border:1px solid #cbb9a5;border-radius:10px;padding:0 14px;font-size:18px;background:#fff}
    input:focus{outline:2px solid #d7b77a;border-color:var(--gold)}
    .btn-row{display:flex;gap:10px;align-items:end;flex-shrink:0}
    button{height:48px;border:0;border-radius:10px;padding:0 22px;font-size:16px;font-weight:700;cursor:pointer;background:var(--maroon);color:#fff}
    button:disabled{opacity:.45;cursor:not-allowed}
    .secondary{background:#8d6a37}
    .viewer{background:#e9e0d5;padding:18px}
    .viewer iframe{display:block;width:100%;height:78vh;min-height:620px;border:0;border-radius:10px;background:white;box-shadow:0 8px 25px rgba(0,0,0,.15)}
    .hint{text-align:center;padding:12px 18px 18px;color:#75666a;font-size:14px}
    .status{text-align:center;color:var(--maroon);font-weight:600;min-height:22px;padding:6px 12px 0}
    @media(max-width:700px){
      h1{font-size:24px}
      .viewer iframe{height:70vh;min-height:520px}
      .controls{align-items:stretch}
      .field{min-width:100%}
      .btn-row{flex-direction:column}
      button{width:100%}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="orn">॥ मंगल परिणय ॥</div>
    <h1>Patrika Pujan Invitation</h1>
    <p class="sub">Enter the guest name and city/village. The original invitation design remains unchanged.</p>
  </header>

  <section class="card">
    <form class="controls" id="form">
      <div class="field">
        <label for="name">Guest Name / મહેમાનનું નામ</label>
        <input id="name" name="name" maxlength="120" autocomplete="off" placeholder="Enter guest name" required>
      </div>
      <div class="field">
        <label for="city">City / Village / શહેર અથવા ગામ</label>
        <input id="city" name="city" maxlength="120" autocomplete="off" placeholder="Enter city or village">
      </div>
      <div class="btn-row">
        <button type="button" class="secondary" id="previewBtn" disabled>Preview</button>
        <button type="submit" id="downloadBtn" disabled>Download PDF</button>
      </div>
    </form>
    <div class="status" id="status"></div>
    <div class="viewer">
      <iframe id="pdfViewer" title="Patrika Pujan invitation preview" src="./assets/Patrika_Pujan_Original.pdf#page=5"></iframe>
    </div>
    <div class="hint">Line 1: Guest name &nbsp;|&nbsp; Line 2: City / Village &nbsp;—&nbsp; All other text, dates, artwork and pages stay unchanged.</div>
  </section>
</div>
<script>
const PDF_URL = './assets/Patrika_Pujan_Original.pdf';
const PLACEMENTS = {
  name_p0: { page: 0, x: 505, y: 1150, maxW: 750 },
  city_p0: { page: 0, x: 505, y: 1250, maxW: 750 },
  name_p4: { page: 4, x: 235, y: 450,  maxW: 1150 },
  city_p4: { page: 4, x: 235, y: 550,  maxW: 1150 },
};

const nameInput = document.getElementById('name');
const cityInput = document.getElementById('city');
const previewBtn = document.getElementById('previewBtn');
const downloadBtn = document.getElementById('downloadBtn');
const viewer = document.getElementById('pdfViewer');
const statusEl = document.getElementById('status');

let cachedPdfBytes = null;
let fontLoaded = false;
let blobUrl = null;

function cleanText(val) {
  return (val || '').replace(/[\x00-\x1f\x7f]/g, '').trim().slice(0, 120);
}

async function ensureFont() {
  if (fontLoaded) return;
  try {
    await document.fonts.load('500 34px NotoSerifGujarati');
  } catch (e) {
    // Fallback fonts still work if custom font fails to load
  }
  fontLoaded = true;
}

async function getBasePdfBytes() {
  if (cachedPdfBytes) return cachedPdfBytes;
  const res = await fetch(PDF_URL);
  if (!res.ok) throw new Error('Could not load base PDF');
  cachedPdfBytes = await res.arrayBuffer();
  return cachedPdfBytes;
}

function renderTextPng(text, maxWidth, maxFont = 34) {
  const scale = 2; // 2x resolution for crisp rendering
  const probe = document.createElement('canvas').getContext('2d');
  let fontSize = maxFont;
  let metrics = null;

  for (let size = maxFont; size >= 15; size--) {
    probe.font = `500 ${size}px "NotoSerifGujarati", Georgia, serif`;
    metrics = probe.measureText(text);
    if (metrics.width + 8 <= maxWidth || size === 15) {
      fontSize = size;
      break;
    }
  }

  const width = Math.max(1, Math.min(maxWidth, Math.ceil(metrics.width) + 12));
  const height = Math.max(60, Math.ceil(fontSize * 1.6) + 12);

  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = height * scale;

  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.font = `500 ${fontSize}px "NotoSerifGujarati", Georgia, serif`;
  ctx.fillStyle = 'rgb(84, 12, 35)';
  ctx.textBaseline = 'top';
  ctx.fillText(text, 4, 6);

  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (!blob) return reject(new Error('Canvas export failed'));
      blob.arrayBuffer().then((buf) => resolve({ buf, width, height })).catch(reject);
    }, 'image/png');
  });
}

async function generatePdfBytes(name, city) {
  if (!window.PDFLib) {
    throw new Error('PDF library is still loading. Please check your internet connection and try again.');
  }
  await ensureFont();
  const baseBytes = await getBasePdfBytes();
  const pdfDoc = await PDFLib.PDFDocument.load(baseBytes);
  const pages = pdfDoc.getPages();

  async function stamp(pl, text) {
    const page = pages[pl.page];
    if (!page) return;
    const { height: pageH } = page.getSize();
    const { buf, width, height } = await renderTextPng(text, pl.maxW);
    const pngImg = await pdfDoc.embedPng(buf);
    page.drawImage(pngImg, {
      x: pl.x,
      y: pageH - pl.y - height,
      width,
      height,
    });
  }

  await stamp(PLACEMENTS.name_p0, name);
  await stamp(PLACEMENTS.name_p4, name);
  if (city) {
    await stamp(PLACEMENTS.city_p0, city);
    await stamp(PLACEMENTS.city_p4, city);
  }

  return await pdfDoc.save();
}

function sync() {
  const ok = cleanText(nameInput.value).length > 0;
  previewBtn.disabled = !ok;
  downloadBtn.disabled = !ok;
  statusEl.textContent = '';
}

nameInput.addEventListener('input', sync);
cityInput.addEventListener('input', sync);

previewBtn.addEventListener('click', async () => {
  const name = cleanText(nameInput.value);
  const city = cleanText(cityInput.value);
  if (!name) return;

  statusEl.textContent = 'Preparing preview… (first load may take a few seconds)';
  previewBtn.disabled = true;
  downloadBtn.disabled = true;
  try {
    const pdfBytes = await generatePdfBytes(name, city);
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(blob);
    viewer.src = blobUrl + '#page=5';
    statusEl.textContent = 'Preview updated. Showing page 5 (guest name page).';
  } catch (e) {
    statusEl.textContent = e.message || 'Could not create preview. Please try again.';
  } finally {
    previewBtn.disabled = false;
    downloadBtn.disabled = false;
  }
});

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = cleanText(nameInput.value);
  const city = cleanText(cityInput.value);
  if (!name) return;

  statusEl.textContent = 'Creating your PDF…';
  previewBtn.disabled = true;
  downloadBtn.disabled = true;
  try {
    const pdfBytes = await generatePdfBytes(name, city);
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const safe = name.replace(/[^A-Za-z0-9_\-]+/g, '_').replace(/^_+|_+$/g, '') || 'Guest';
    const a = document.createElement('a');
    a.href = url;
    a.download = `Patrika_Pujan_${safe}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    statusEl.textContent = 'PDF downloaded!';
  } catch (e) {
    statusEl.textContent = e.message || 'Could not create PDF. Please try again.';
  } finally {
    previewBtn.disabled = false;
    downloadBtn.disabled = false;
  }
});

sync();
</script>
</body>
</html>
